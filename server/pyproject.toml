[project]
name = "industry-intelligence-radar-server"
version = "0.2.0"
description = "Industry news discovery, AI organization, and intelligence assessment service."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "feedparser>=6.0.12,<7",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "trafilatura>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["../test/server"]
